[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nplm-2026"
version = "0.1.0"
description = "Neural / classical language modeling pipeline (NPLM, N-gram, Seq2Seq, GPT stubs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0.0",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
  "tqdm>=4.65.0",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "scripts*"]
